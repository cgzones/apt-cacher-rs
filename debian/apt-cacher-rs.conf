# apt-cacher-rs configuration file - TOML syntax.
#
# Every commented-out assignment below shows the built-in default, unless
# its comment says otherwise; uncommenting it as-is changes nothing.
#
# Value conventions used throughout this file:
#   (seconds) - a plain number of seconds; fractions are accepted (e.g.
#               2.5).
#   (bytes)   - a quoted string; the magnitude suffixes k, Ki, M, Mi, G and
#               Gi are accepted, where k/M/G are decimal (1000) and Ki/Mi/Gi
#               are binary (1024).
#   Range:    - the values the daemon accepts; anything outside aborts
#               startup with an error.


## Logging

# Minimum log level severity to output.
# One of 'trace', 'debug', 'info', 'warn', 'error' or 'off'
# (case-insensitive).
# 'trace' dumps full request and response details and 'debug' narrates
# per-connection decisions; either can expose upstream credentials such as
# Authorization headers, so keep them out of production and do not share
# such logs unredacted.
# Overridable with -l/--log-level.
#log_level = 'info'

# Path to log file.
# The special value `console` will output to the console.
# Overridable with --log-file.
#log_file = 'console'


## Paths

# Path to database.
# Overridable with --database-path.
#database_path = '/var/lib/apt-cacher-rs/apt-cacher-rs.db'

# Path to cache directory.
# Overridable with --cache-path.
#cache_directory = '/var/cache/apt-cacher-rs'


## Network and upstream

# Address to listen on.
# Overridable with --bind.
#bind_addr = '::'

# Port to listen on.
# Overridable with --bind.
#bind_port = 3142

# HTTPS upgrade mode for connections to upstream mirrors.
# 'Auto'   - try https first and fall back to http if that attempt fails;
#            the outcome is remembered per mirror host and port, and
#            re-evaluated after a terminal upstream failure.
# 'Always' - use https only, with no fallback to http.
# 'Never'  - always use plain http.
# Mirrors listed in 'http_only_mirrors' always use http regardless.
#https_upgrade_mode = 'Auto'

# Whether to set TCP_NODELAY on upstream sockets.
#upstream_tcp_nodelay = true

# Whether to reject differential (pdiff) resource requests with 410 Gone.
# When disabled, diff requests are proxied to the upstream mirror but not
# cached (while full resources are always cached).
#reject_pdiff_requests = true


## Timeouts

# Timeout (seconds) of database operations after which a warning is
# generated.
# Range: 1-60.
#database_slow_timeout = 2

# Timeout (seconds) for a single stalled network operation: the upstream
# TCP connect, the TLS handshake, and the subsequent reads and writes on
# both the upstream and the client socket. It bounds one operation making
# no progress, not a whole transfer. Waiting for a client's next request
# is bounded by 'client_idle_timeout' instead.
# Range: 1-360.
#http_timeout = 10

# Timeout (seconds) after which an inbound client connection is closed
# while waiting for a complete HTTP request - covers idle keep-alive
# connections and slowloris-style partial header sends - and after which an
# established https tunnel with no traffic in either direction is torn down.
# Range: 1-3600.
#client_idle_timeout = 120

# Wall-clock budget (seconds) for the whole upstream connect-retry
# envelope. Retries use a Fibonacci backoff (0.5s, 0.5s, 1s, 1.5s, 2.5s,
# ...) capped at ten retries; a retry whose delay would finish past this
# budget is not started and the request fails instead, so a dead mirror
# cannot hold an upstream-download slot for the full schedule.
# Range: 1-600.
#upstream_retry_budget = 30


## Limits

# Maximum number of concurrent connections across all clients, including
# https tunnels. Connections beyond it are closed at accept time.
# 0 means unlimited.
# While the key stays absent the daemon derives the cap at startup from
# three quarters of the soft file descriptor limit (RLIMIT_NOFILE),
# keeping the rest for cache files, upstream sockets and the database.
# The value shown is only what the shipped systemd unit yields
# (LimitNOFILE=16384); uncommenting the line pins that fixed number no
# matter what the actual limit turns out to be.
#max_connections = 12288

# Maximum number of concurrent connections per client IP.
# 0 means unlimited.
#max_connections_per_client_ip = 0

# Maximum number of concurrent downloads of the proxy from upstream
# mirrors.
# 0 means unlimited.
#max_upstream_downloads = 20

# Minimum transfer rate (bytes per second) required both of upstream
# downloads and of deliveries to clients. Connections that fail to fulfill
# this rate are cancelled.
# Set to '0' to disable the check; 'rate_check_timeframe' must then be left
# at its default of 30, or the daemon refuses to start.
#min_download_rate = '10k'

# Sliding window (seconds) over which the minimum transfer rate is
# measured.
# Range: 1-360.
#rate_check_timeframe = 30

# Disk quota (bytes) for cache.
# '0' means unlimited.
#disk_quota = '0'

# Minimum free disk space (bytes) on the cache filesystem for the
# /healthcheck endpoint to report healthy.
# '0' disables the check.
#min_disk_free = '512Mi'

# Maximum size (bytes) of a single upstream object that will be downloaded
# and cached. An upstream response declaring a larger Content-Length is
# rejected with 502 Bad Gateway before any bytes are stored.
# Set to '0' to disable the cap; any other value must be at least 1Mi.
#max_object_size = '2Gi'


## Cache retention

# Backstop retention time (in days) for files acquired "by-hash". By-hash
# cleanup is primarily reference-based (a file is reclaimed once its digest
# is absent from the mirror's current Release set, after a short grace);
# this age cap only applies as a fallback when no current Release can be
# read, so it rarely governs disk usage on a healthy mirror.
# Must be at least 1; there is no value that disables the backstop.
#byhash_retention_days = 90

# Retention time (in days) for usage logs.
# 0 means never delete.
#usage_retention_days = 30


## Mirrors

# Mirror aliases.
# Cache content for a list of mirrors under a common name.
# The initial download is still fetched from the requested mirror,
# but content already in cache is served for any aliased mirror.
# Statistics, origins and the cleanup's index fetches use the common name,
# so it should be a reachable mirror listed in 'allowed_mirrors'.
# Example:
#   aliases = [ [ 'deb.debian.org' , [ 'ftp.ca.debian.org' ] ] ]
#aliases = []

# List of allowed mirrors.
# Host names may use a leading wildcard label, e.g. '*.ubuntu.com'.
# Note that by default no mirrors are allowed.
# Example:
#   allowed_mirrors = [ 'deb.debian.org', '*.ubuntu.com' ]
#allowed_mirrors = []

# List of mirrors supporting only http.
# These mirrors are exempted from https upgrade.
# Note that the mirrors need to be allowed via 'allowed_mirrors'.
# Example:
#   http_only_mirrors = [ 'ftp.au.debian.org' ]
#http_only_mirrors = []


## Access control

# List of clients permitted to use the proxy.
# If no clients are listed no restrictions are applied.
# Note that localhost is not implicitly allowed.
# Example:
#   allowed_proxy_clients = [ '192.168.0.0/16', '127.0.0.1' ]
#allowed_proxy_clients = []

# List of clients permitted to use the web interface.
# Leaving the key unset - as shipped - inherits the list from
# 'allowed_proxy_clients'. Setting it to an explicit empty list instead
# applies no restriction at all, allowing every client.
# Note that localhost is not implicitly allowed.
# Example:
#   allowed_webif_clients = [ '192.168.0.0/16', '127.0.0.1' ]


## HTTPS tunneling

# Whether https tunneling (CONNECT) is enabled.
# Disabled by default; enable it together with 'https_tunnel_allowed_mirrors'.
#https_tunnel_enabled = false

# Allowed ports for https tunneling.
#https_tunnel_allowed_ports = [ 443 ]

# Allowed mirrors for https tunneling.
# Entries are exact host names or IP addresses; wildcards are not
# supported here, unlike in 'allowed_mirrors'.
# Note that by default no tunnel targets are allowed: an empty list refuses
# every CONNECT request, like an empty 'allowed_mirrors' refuses every GET.
# Example:
#   https_tunnel_allowed_mirrors = [ 'ftp.ca.debian.org',
#                                    'metadata.ftp-master.debian.org' ]
#https_tunnel_allowed_mirrors = []

# Maximum number of concurrent HTTPS tunnel connections per client IP.
# 0 means unlimited.
#https_tunnel_max_connections_per_client = 10


## Integrity verification

# Whether to verify cached content against the repository's own metadata
# (by-hash digests, Packages checksums, Release checksums) before committing
# a download to the cache. Defence in depth; APT's GPG check remains the
# root of trust.
#verify_checksums = true

# Upper bound (entries) on the in-memory checksum registry.
# One full Debian main/amd64 Packages index is roughly 64k entries.
#verify_checksums_max_entries = 500000

# Backoff window (seconds) applied to a resource after its download failed
# checksum verification: further requests for it are rejected with 503
# without contacting upstream. Doubles per consecutive failure up to
# verify_checksums_throttle_cap; a verified download clears it. 0 disables.
#verify_checksums_throttle_base = 30

# Upper bound (seconds) on the exponential verification-failure backoff.
#verify_checksums_throttle_cap = 3600


## Internals

# Size (bytes) of buffer used for internal data transfer.
# Range: 1Ki-1Gi; values above 16Mi start the daemon with a warning.
#buffer_size = '32Ki'

# Number of stored error and warning log messages.
#logstore_capacity = 100

# Capacity of the internal database command channel.
# Range: 1-4096.
#db_channel_capacity = 128

# Maximum number of pending database events buffered before a batch flush.
# Range: 1-4096.
#db_batch_flush_max_count = 256

# Interval (seconds) between database batch flushes and mirror last_seen
# syncs.
# Range: 1-300.
#db_batch_flush_interval_secs = 15

# Threshold (bytes) for using memory-mapped files for large downloads.
# Unlike the other size settings this is a bare integer of bytes; magnitude
# suffixes are not accepted here.
# Only effective in builds with the 'mmap' cargo feature (part of the
# default feature set); the daemon warns when it is set otherwise.
#mmap_threshold = 1048576

# Whether to pin kTLS handshake buffers (holding TLS secrets) in RAM via
# mlock(2), keeping them out of swap. Disable in mlock-restricted
# environments (containers, tight RLIMIT_MEMLOCK).
# Only effective in builds with the 'ktls' cargo feature (not enabled by
# default); the daemon warns when it is set otherwise.
#ktls_memory_lock = true
