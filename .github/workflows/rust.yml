name: Rust

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Rust Build
    runs-on: ubuntu-latest

    env:
      RUSTFLAGS: "-D warnings"
      SQLX_OFFLINE: true
      # `default` resolves identically to the explicit `hyper,mmap,sendfile,tls_rustls`
      # combination, so excluding it drops two duplicate runs from the powerset.
      HACK: >-
        --feature-powerset
        --exclude-features default
        --at-least-one-of tls_hyper,tls_rustls
        --mutually-exclusive-features tls_hyper,tls_rustls
        --at-least-one-of hyper,splice
        --verbose

    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-hack
      - uses: taiki-e/install-action@nextest
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: Build
        run: cargo hack $HACK build --locked

      - name: Lint via Clippy
        run: cargo hack $HACK clippy --all-targets --locked -- -D warnings -D clippy::pedantic

      - name: Test
        run: cargo hack $HACK nextest run --all-targets --locked

      # Over the powerset, not one config: an intra-doc link to a cfg-gated
      # item resolves in the build that compiles it and dangles in the others.
      - name: Documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo hack $HACK doc --no-deps --locked

  formatting:
    name: Rust source formatting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          cache: false

      - name: Rustfmt Check
        uses: actions-rust-lang/rustfmt@v1
