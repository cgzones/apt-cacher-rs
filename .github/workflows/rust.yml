name: Rust

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Rust Build
    runs-on: ubuntu-latest

    env:
      RUSTFLAGS: "-D warnings"
      SQLX_OFFLINE: true
      # `default` resolves identically to the explicit `hyper,sendfile,tls_rustls`
      # combination, so excluding it drops two duplicate runs from the powerset.
      HACK: >-
        --feature-powerset
        --exclude-features default
        --at-least-one-of tls_hyper,tls_rustls
        --mutually-exclusive-features tls_hyper,tls_rustls
        --at-least-one-of hyper,splice
        --verbose

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A pinned action SHA does not pin what it downloads: name the tool
      # versions too.  Dependabot does not bump these; update them by hand.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-hack@0.6.46,nextest@0.9.151
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: clippy

      - name: Build
        run: cargo hack $HACK build --locked

      - name: Lint via Clippy
        run: cargo hack $HACK clippy --all-targets --locked -- -D warnings -D clippy::pedantic

      - name: Test
        env:
          # The IPv6 integration tests skip where the host has no IPv6
          # loopback; here that would be a silent pass, so make it a failure.
          APT_CACHER_RS_REQUIRE_IPV6: "1"
        run: cargo hack $HACK nextest run --all-targets --locked

      # Over the powerset, not one config: an intra-doc link to a cfg-gated
      # item resolves in the build that compiles it and dangles in the others.
      - name: Documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo hack $HACK doc --no-deps --locked

  formatting:
    name: Rust source formatting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: rustfmt
          cache: false

      - name: Rustfmt Check
        uses: actions-rust-lang/rustfmt@4066006ec54a31931b9b1fddfd38f2fdf2d27143 # v1.1.2
