name: Audit Dependencies (Scheduled)
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  audit:
    permissions:
      contents: read
      issues: write

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Audit Rust Dependencies
        uses: actions-rust-lang/audit@v1
