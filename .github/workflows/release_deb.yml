name: Release Debian Package

on:
  push:
    tags:
      - 'v*'

jobs:
  build-deb:
    permissions:
      contents: write

    name: Generate Debian Package
    runs-on: ubuntu-latest

    env:
      RUSTFLAGS: "-D warnings"
      SQLX_OFFLINE: true

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1.16.0
        with:
          toolchain: stable

      - name: Install cargo-deb
        uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2.85.6
        with:
          tool: cargo-deb

      - name: Build Debian package
        # `--strip` runs `strip --strip-all`, which also drops the
        # `.comment` section that `[profile.release] strip = true` leaves
        # behind. cargo-deb has no option to add an md5sums control file,
        # so it is generated below.
        run: cargo deb --locked --strip

      - name: Add md5sums control file
        run: |
          set -euo pipefail
          set -- target/debian/*.deb
          deb=$1
          tmp=$(mktemp -d)
          dpkg-deb -R "$deb" "$tmp"
          (cd "$tmp" && find . -type f ! -path './DEBIAN/*' -printf '%P\0' \
            | LC_ALL=C sort -z \
            | xargs -0 md5sum > DEBIAN/md5sums)
          chmod 644 "$tmp/DEBIAN/md5sums"
          dpkg-deb --root-owner-group -b "$tmp" "$deb"
          rm -rf "$tmp"

      - name: Run lintian
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lintian
          lintian --display-experimental --info --display-info --pedantic \
                  --tag-display-limit 0 --color auto target/debian/*.deb

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: target/debian/*.deb
          fail_on_unmatched_files: true
