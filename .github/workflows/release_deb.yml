name: Release Debian Package

on:
  push:
    tags:
      - 'v*'

jobs:
  build-deb:
    # Read-only: this job runs every dependency's build script, so it never
    # holds a token that can write to the repository; `release` below does
    # the writing with nothing but the finished package.
    permissions:
      contents: read

    name: Generate Debian Package
    runs-on: ubuntu-latest
    # Build on the oldest supported release: cargo-deb derives the package's
    # library dependencies (`$auto`) from the build system.  Built on the
    # runner's Ubuntu, the package depends on the t64-renamed `libssl3t64`,
    # which Debian 12 lacks, and may pick up newer glibc symbol versions.
    # Built here it depends on `libssl3`, which the t64 releases provide.
    container: docker.io/library/debian:bookworm

    defaults:
      run:
        shell: bash

    env:
      RUSTFLAGS: "-D warnings"
      SQLX_OFFLINE: true

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git libssl-dev lintian pkg-config

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing below pushes; keep the token out of `.git/config`, where
          # every dependency's build script could read it.
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          # A release is built from scratch, never from a cache another
          # workflow run could have written.
          cache: false

      - name: Install cargo-deb
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deb@3.8.0

      - name: Build Debian package
        # `--strip` runs `strip --strip-all`, which also drops the
        # `.comment` section that `[profile.release] strip = true` leaves
        # behind. cargo-deb has no option to add an md5sums control file,
        # so it is generated below.
        run: cargo deb --locked --strip

      - name: Add md5sums control file
        run: |
          set -euo pipefail
          set -- target/debian/*.deb
          deb=$1
          tmp=$(mktemp -d)
          dpkg-deb -R "$deb" "$tmp"
          (cd "$tmp" && find . -type f ! -path './DEBIAN/*' -printf '%P\0' \
            | LC_ALL=C sort -z \
            | xargs -0 md5sum > DEBIAN/md5sums)
          chmod 644 "$tmp/DEBIAN/md5sums"
          dpkg-deb --root-owner-group -b "$tmp" "$deb"
          rm -rf "$tmp"

      - name: Run lintian
        run: |
          lintian --display-experimental --info --display-info --pedantic \
                  --tag-display-limit 0 --color auto target/debian/*.deb

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debian-package
          path: target/debian/*.deb
          if-no-files-found: error
          retention-days: 1

  # Install the package on every supported release and start the binary:
  # dpkg resolves the dependencies and the dynamic loader the symbol
  # versions, which lintian checks neither of.
  install-test:
    needs: build-deb
    permissions: {}

    name: Install on ${{ matrix.image }}
    runs-on: ubuntu-latest
    container: docker.io/library/${{ matrix.image }}

    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:bookworm
          - debian:trixie
          - ubuntu:noble

    steps:
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: debian-package
          path: dist

      - name: Install package
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y ./dist/*.deb

      - name: Run binary
        run: apt-cacher-rs --version

  release:
    needs: install-test
    permissions:
      contents: write

    name: Draft Release
    runs-on: ubuntu-latest

    steps:
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: debian-package
          path: dist

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: dist/*.deb
          fail_on_unmatched_files: true
