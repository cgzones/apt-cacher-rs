name: JavaScript

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Hand-written, dependency-free scripts: a syntax check per file is the
      # whole toolchain (no npm, no package.json). The banned-API and ASCII
      # checks are Rust unit tests in src/web/assets.rs.
      - name: node --check
        run: |
          for f in src/web/assets/js/*.js; do
            echo "$f"
            node --check "$f"
          done

      # The browser runs the files as one script, joined in the order
      # src/web/assets.rs lists them: check that bundle too.  The extraction
      # must find every file: if it stops matching assets.rs, node would
      # happily accept an empty or truncated bundle.
      - name: node --check (bundle)
        shell: bash
        run: |
          mapfile -t files < <(
            sed -n '/static SCRIPT/,/^);/p' src/web/assets.rs \
              | grep -o 'assets/js/[a-z]*\.js' \
              | sed 's|^|src/web/|'
          )
          all=(src/web/assets/js/*.js)
          if [ "${#files[@]}" -ne "${#all[@]}" ]; then
            echo "::error::bundle lists ${#files[@]} of ${#all[@]} files in src/web/assets/js" >&2
            exit 1
          fi
          cat -- "${files[@]}" > "$RUNNER_TEMP/app.js"
          node --check "$RUNNER_TEMP/app.js"
