name: Spelling

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  spaces-check:
    name: Spaces Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Spaces check
        run: git diff-tree --check $(git hash-object -t tree /dev/null) HEAD

  spellings:
    name: Codespell
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install codespell
        run: |
          sudo apt-get update
          sudo apt-get install -y codespell

      - name: Run codespell
        run: codespell

  typos:
    name: Typos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Picks up _typos.toml automatically.  Complements codespell: the two
      # carry different dictionaries and disagree on what is a typo.
      - name: Run typos
        uses: crate-ci/typos@v1.50.0
