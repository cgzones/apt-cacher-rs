[advisories]
ignore = [
    # Keep in sync with the [advisories] section in deny.toml.
    #
    # RUSTSEC-2026-0459: bundled SQLite <3.54 can expose uninitialized memory
    # via a crafted db + -wal pair. Fixed in libsqlite3-sys 0.39, but
    # sqlx-sqlite 0.9.0 caps it at <0.38 (sqlx main already allows <0.40).
    # apt-cacher-rs only opens its own database in its own state directory,
    # never one a less-trusted party could write. Drop once a sqlx release
    # allows libsqlite3-sys 0.39.
    "RUSTSEC-2026-0459",
]
